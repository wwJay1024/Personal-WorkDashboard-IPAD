<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>看板编辑器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="editor-body">
    <main class="editor-shell">
      <header class="editor-topbar">
        <h1>看板编辑器</h1>
        <span class="editor-status" id="editorStatus">正在加载</span>
        <a class="link-button" href="/">打开看板</a>
      </header>

      <div class="editor-main">
        <section class="editor-calendar-layout">
          <div class="editor-calendar-mini" id="calendarMini"></div>
          <div class="editor-calendar-list">
            <h3 id="calendarSelectedDate">选择日期</h3>
            <div id="calendarItemsList"></div>
            <div class="calendar-add-row">
              <input id="calendarNewItem" placeholder="添加当日事项" />
              <button id="calendarAddBtn">添加</button>
            </div>
          </div>
        </section>

        <section class="editor-panel">
          <h2>新增便签</h2>
          <form id="noteForm">
            <label>
              内容
              <textarea name="content" required rows="4" placeholder="写一条要留在看板上的提醒"></textarea>
            </label>
            <label class="check-row">
              <input name="pinned" type="checkbox" />
              置顶
            </label>
            <button type="submit">添加便签</button>
          </form>

          <div class="editor-notes-list">
            <h2>已有便签</h2>
            <div id="notesList"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="/editor.js" defer></script>
  </body>
</html>
